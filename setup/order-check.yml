# Copy this file to .github/workflows/order-check.yml and commit it yourself.
# Run it once by hand while the market is open (9:30 a.m. to 4 p.m. ET).
# It places two tiny VOO buy orders priced 50% below the market, so they
# cannot fill, then cancels them, and saves the result to log/order_check.json.

name: order-check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trend-bot              # never at the same time as the daily bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check order types on the paper account
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python bot.py --check-orders

      - name: Commit the result
        if: always()
        run: |
          [ -f log/order_check.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log/order_check.json
          git diff --cached --quiet && exit 0
          git commit -m "Order check $(date -u +%F)"
          git pull --rebase
          git push
