name: trend-bot

on:
  schedule:
    - cron: "17 15 * * 1-5"    # 15:17 UTC on weekdays: 10:17 a.m. ET until Mar 14, 2027, then 11:17
  workflow_dispatch:            # the "Run workflow" button, for dry runs and checks

permissions:
  contents: write               # lets the job commit the log back to the repository

concurrency:
  group: trend-bot              # never two runs at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
        run: python bot.py

      - name: Commit the log
        if: always()
        run: |
          [ -d log ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log
          git diff --cached --quiet && exit 0
          git commit -m "Log for $(date -u +%F)"
          git pull --rebase
          git push
